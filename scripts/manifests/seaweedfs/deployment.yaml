apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-secret
type: Opaque
stringData:
  ACCESS_KEY_ID: "seaweedadmin"
  SECRET_KEY: "seaweedadmin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-filer-config
data:
  filer.toml: |
    [leveldb2]
    enabled = true
    dir = "/tmp/filerldb2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: ghcr.io/chrislusf/seaweedfs:4.34
          args:
            - server
            - -dir=/tmp
            - -s3
            - -iam
            - -filer
            - -master.volumePreallocate=false
          env:
            - name: accesskey
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-secret
                  key: ACCESS_KEY_ID
            - name: secretkey
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-secret
                  key: SECRET_KEY
          ports:
            - containerPort: 8333
              name: s3
          volumeMounts:
            - name: filer-config
              mountPath: /etc/seaweedfs/filer.toml
              subPath: filer.toml
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      if wget -q --spider http://127.0.0.1:8333/status; then
                        break
                      fi
                      if [ "$i" -eq 60 ]; then
                        echo "ERROR: SeaweedFS did not become ready within 120 seconds"
                        exit 1
                      fi
                      sleep 2
                    done

                    for i in $(seq 1 5); do
                      echo "s3.bucket.create --name default" | /usr/bin/weed shell 2>&1 || true
                      if echo "s3.bucket.list" | /usr/bin/weed shell 2>/dev/null | grep -q default; then
                        break
                      fi
                      if [ "$i" -eq 5 ]; then
                        echo "ERROR: default bucket was not created"
                        exit 1
                      fi
                      sleep 5
                    done

                    for i in $(seq 1 5); do
                      if echo "s3.configure -user admin -access_key $accesskey -secret_key $secretkey -actions Admin -apply" | /usr/bin/weed shell 2>&1; then
                        break
                      fi
                      if [ "$i" -eq 5 ]; then
                        echo "ERROR: failed to configure the SeaweedFS admin user"
                        exit 1
                      fi
                      sleep 5
                    done

                    touch /tmp/initialization-complete
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/initialization-complete && echo "s3.bucket.list" | /usr/bin/weed shell | grep -q default
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /status
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8333
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: filer-config
          configMap:
            name: seaweedfs-filer-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
      protocol: TCP
      name: api
