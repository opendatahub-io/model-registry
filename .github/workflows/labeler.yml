name: "Pull Request Labeler"
on:
- pull_request_target

permissions: # set contents: read at top-level, per OpenSSF ScoreCard rule TokenPermissionsID
  contents: read

jobs:
  labeler:
    # Must match upstream-sync.yml; cover the entire label read/replace cycle.
    concurrency:
      group: pr-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
