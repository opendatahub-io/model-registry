# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

multi-ecosystem-groups:
  model-registry-server:
    schedule:
      interval: "weekly"
  controller:
    schedule:
      interval: "weekly"
  csi:
    schedule:
      interval: "weekly"
  async-upload:
    schedule:
      interval: "weekly"

updates:
  # The root Go module is shared by the model registry and catalog servers.
  - package-ecosystem: "gomod"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "model-registry-server"
  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "model-registry-server"

  - package-ecosystem: "gomod"
    directories:
      - "/cmd/controller/"
      - "/pkg/inferenceservice-controller/"
    patterns: ["*"]
    multi-ecosystem-group: "controller"
  - package-ecosystem: "docker"
    directory: "/cmd/controller/"
    patterns: ["*"]
    multi-ecosystem-group: "controller"

  - package-ecosystem: "gomod"
    directory: "/cmd/csi/"
    patterns: ["*"]
    multi-ecosystem-group: "csi"
  - package-ecosystem: "docker"
    directory: "/cmd/csi/"
    patterns: ["*"]
    multi-ecosystem-group: "csi"

  - package-ecosystem: "pip"
    directory: "/jobs/async-upload/"
    patterns: ["*"]
    multi-ecosystem-group: "async-upload"
    # requirements.txt is generated by Poetry; update its source files instead.
    exclude-paths:
      - "requirements.txt"
  - package-ecosystem: "docker"
    directory: "/jobs/async-upload/"
    patterns: ["*"]
    multi-ecosystem-group: "async-upload"

  - package-ecosystem: "pip"
    directory: "/clients/python/"
    schedule:
      interval: "weekly"
    groups:
      model-registry-python-client:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/catalog/clients/python/"
    schedule:
      interval: "weekly"
    groups:
      model-catalog-python-client:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/pkg/openapi/"
    schedule:
      interval: "weekly"
    groups:
      model-registry-go-client:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/catalog/pkg/openapi/"
    schedule:
      interval: "weekly"
    groups:
      model-catalog-go-client:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/gorm-gen/"
    schedule:
      interval: "weekly"
    groups:
      gorm-gen:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/tools/csv-exporter/"
    schedule:
      interval: "weekly"
    groups:
      model-catalog-csv-exporter:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/clients/ui/bff/"
    schedule:
      interval: "weekly"
    groups:
      ui-bff:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/clients/ui/frontend/"
    schedule:
      interval: "weekly"
    groups:
      ui-frontend:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
