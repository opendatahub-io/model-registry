apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- kubeflow-dashboard-rbac.yaml
- auth-proxy-configmap.yaml

patches:
- path: model-registry-ui-deployment.yaml
  target:
    group: apps
    kind: Deployment
    name: model-registry-ui
    version: v1
- path: model-registry-ui-service.yaml
  target:
    group: apps
    kind: Service
    name: model-registry-service
    version: v1
namespace: kubeflow

replacements:
- source:
    kind: ServiceAccount
    name: model-registry-ui
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: ClusterRoleBinding
      name: model-registry-ui-services-reader-binding
    fieldPaths:
    - subjects.0.namespace
    options:
      create: true
  - select:
      kind: ClusterRoleBinding
      name: model-registry-retrieve-clusterrolebindings-binding
    fieldPaths:
    - subjects.0.namespace
    options:
      create: true
  - select:
      kind: ClusterRoleBinding
      name: model-registry-create-sars-binding
    fieldPaths:
    - subjects.0.namespace
    options:
      create: true
